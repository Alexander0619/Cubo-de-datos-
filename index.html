<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cubo de Calidad Streaming</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra de pestañas arriba; en "Cubo" los controles quedan sobre una tabla de calor que ocupa el ancho. */
:root{
  --bg:#f3f6f8; --surface:#ffffff; --surface2:#e8eef1; --fg:#13222b; --muted:#566872; --line:#d3dde2;
  --accent:#0a7487; --accent-fg:#ffffff; --warn:#a85a00; --bad:#b3261e; --good:#1c7a4a;
  --f-head:'Space Grotesk',system-ui,sans-serif; --f-body:'Inter',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1a20; --surface:#16252d; --surface2:#1e313a; --fg:#e4eef2; --muted:#93a8b2; --line:#2a404a;
  --accent:#4cc3d6; --accent-fg:#06222a; --warn:#e0a050; --bad:#f08a80; --good:#6fd29b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a20; --surface:#16252d; --surface2:#1e313a; --fg:#e4eef2; --muted:#93a8b2; --line:#2a404a;
  --accent:#4cc3d6; --accent-fg:#06222a; --warn:#e0a050; --bad:#f08a80; --good:#6fd29b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body);padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font:700 26px/1.15 var(--f-head);margin:0;text-wrap:balance}
h2{font:700 17px/1.25 var(--f-head);margin:0 0 6px}
p{margin:0;max-width:70ch}
.sub{color:var(--muted)}
.tag{display:inline-block;font:500 11px var(--f-mono);letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:var(--surface)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{font:500 14px var(--f-body);background:none;border:0;color:var(--muted);padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{display:flex;flex-direction:column;gap:16px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.ctl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctl label,.lbl{font:500 11px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
select{font:14px var(--f-body);background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 8px;max-width:100%}
.btn{font:500 13px var(--f-body);background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 11px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:13px var(--f-body);background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:3px 11px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.fgrid>div{display:flex;flex-direction:column;gap:6px;min-width:0}
.presets{display:flex;gap:8px;flex-wrap:wrap}
.presets .btn{text-align:left}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font:500 12px var(--f-mono);color:var(--muted);background:var(--surface2);position:sticky;top:0}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface2);z-index:1}
td.heat{font-family:var(--f-mono);font-size:13px}
td.low{font-style:italic;color:var(--muted);outline:1px dashed var(--line);outline-offset:-3px}
tr.tot td{font-weight:600;border-top:2px solid var(--line)}
td.bar{text-align:left;min-width:220px}
.barc{display:flex;align-items:center;gap:8px}
.barc i{display:block;height:12px;background:var(--accent);border-radius:0 4px 4px 0;min-width:2px}
.mode{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.note{font-size:13px;color:var(--muted)}
.hl{color:var(--fg);font-weight:600}
svg text{font-family:var(--f-body);fill:var(--fg)}
.sbox{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.sdim{cursor:pointer}
.sdim:hover .sbox,.sdim.sel .sbox{stroke:var(--accent);stroke-width:2.5}
.shead{font:700 13px var(--f-head)}
.scol{font:11px var(--f-mono);fill:var(--muted)}
.hier{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.hier span.l{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:3px 9px;font:13px var(--f-mono)}
.hier span.a{color:var(--muted)}
.cmp{width:100%}
.cmp td,.cmp th{white-space:normal;text-align:left;vertical-align:top}
.cmp th:first-child{position:static}
.big{font:700 22px var(--f-head);font-variant-numeric:tabular-nums}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.rej{color:var(--bad)} .fix{color:var(--warn)} .okc{color:var(--good)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
code{font:12px var(--f-mono);background:var(--surface2);padding:1px 5px;border-radius:4px}
@media (prefers-reduced-motion:no-preference){td.heat{transition:background .25s}}
</style>

 </div>
 <div id="out">${tabla(d)}</div>`}
function groupBy(d,fn){const m=new Map();d.forEach(r=>{const k=fn(r);if(!m.has(k))m.set(k,[]);m.get(k).push(r)});return m}
function tabla(d){
 if(!d.length)return '<div class="box">Ningún dato cumple los filtros. Quita alguno para volver a ver el cubo.</div>';
 const M=MEAS[S.m],rk=S.rows,ck=S.cols;
 const rows=sorted(rk,[...new Set(d.map(r=>r[rk]))]);
 const cols=ck==='none'?[]:sorted(ck,[...new Set(d.map(r=>r[ck]))]);
 const byR=groupBy(d,r=>r[rk]);
 const cell={};let vals=[];
 rows.forEach(a=>{const g=byR.get(a);if(ck==='none'){const v=M.f(g);cell[a]={v,n:g.length};vals.push(v)}else{const bc=groupBy(g,r=>r[ck]);cols.forEach(c=>{const x=bc.get(c);if(x){const v=M.f(x);cell[a+'||'+c]={v,n:x.length};vals.push(v)}})}});
 const mn=Math.min(...vals),mx=Math.max(...vals),sh=v=>mx===mn?0:(v-mn)/(mx-mn);
 const bg=v=>`background:color-mix(in srgb,var(--accent) ${Math.round(8+sh(v)*47)}%,var(--surface))`;
 let h=`<div class="tbl"><table><thead><tr><th>${FIELDS[rk].split('›')[1].trim()}</th>`;
 if(ck==='none')h+=`<th style="text-align:left">${M.n}</th>`;else{cols.forEach(c=>h+=`<th>${esc(c)}</th>`);h+=`<th>Total</th>`}
 h+='</tr></thead><tbody>';
 rows.forEach(a=>{h+=`<tr><td>${esc(a)}</td>`;
  if(ck==='none'){const c=cell[a];h+=`<td class="bar${c.n<5?' low':''}" title="${c.n} sesiones"><div class="barc"><i style="width:${Math.max(2,sh(c.v)*70+4)}%;max-width:260px"></i><span class="hl">${M.fmt(c.v)}${c.n<5?'*':''}</span><span class="note">${c.n} ses.</span></div></td>`}
  else{cols.forEach(c=>{const x=cell[a+'||'+c];h+=x?`<td class="heat${x.n<5?' low':''}" style="${bg(x.v)}" title="${x.n} sesiones">${M.fmt(x.v)}${x.n<5?'*':''}</td>`:`<td class="heat" style="color:var(--muted)">–</td>`});
   h+=`<td class="heat">${M.fmt(M.f(byR.get(a)))}</td>`}
  h+='</tr>'});
 if(ck!=='none'){h+=`<tr class="tot"><td>Total</td>`;const bc=groupBy(d,r=>r[ck]);cols.forEach(c=>h+=`<td class="heat">${M.fmt(M.f(bc.get(c)))}</td>`);h+=`<td class="heat">${M.fmt(M.f(d))}</td></tr>`}
 h+='</tbody></table></div>';
 let best=null,bk='';Object.entries(cell).forEach(([k,c])=>{if(c.n>=5&&(best===null||c.v>best.v)){best=c;bk=k}});
 const lab=bk.split('||').map(esc).join(' × ');
 return h+`<div class="note"><span class="tag">${M.t}</span> ${M.why}${best&&M.bad!==undefined?` Valor más alto: <span class="hl">${lab}</span> con ${M.fmt(best.v)}.`:''}<br>Las celdas con * tienen menos de 5 sesiones y no se exportarían (k = 5).</div>`}

function vMedidas(){

 return `<div class="box"><h2>Tres tipos de medida</h2>
 <div class="tbl" style="margin-top:8px"><table class="cmp"><thead><tr><th>Tipo</th><th>Cómo se combina</th><th>En este sistema</th><th>Guardar resumen</th></tr></thead><tbody>
 <tr><td><b>Distributiva</b></td><td>Se aplica a cada parte y se vuelve a aplicar al resultado</td><td>conteo de sesiones, suma de paquetes, latencia máxima</td><td>Sí</td></tr>
